# All Node tooling runs in this container. Nothing is installed on the host.
# node_modules and .next live in named volumes so they never touch the host disk.
services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"

volumes:
  node_modules:
  next_cache:
